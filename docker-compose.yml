services:
  db:
    image: mysql:latest
    container_name: mysql-kanban-api
    restart: always
    environment:
      MYSQL_DATABASE: kanban
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3309:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-kanban-api
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "8084:80"
    depends_on:
      - db
volumes:
  mysql-data: